# Tuned for a Raspberry Pi 5 (8 GB) sharing the host with Next.js, Go and Airflow.
listen_addresses = '*'
max_connections = 60
shared_buffers = 256MB
effective_cache_size = 1GB
work_mem = 4MB
maintenance_work_mem = 64MB
wal_compression = on
checkpoint_timeout = 15min
max_wal_size = 512MB
synchronous_commit = on
log_min_duration_statement = 500
timezone = 'UTC'

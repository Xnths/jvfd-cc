# Edge safety net for psicologojoaofernandes.com: passes traffic to the Pi through the tunnel and
# serves a snapshot of the ad landing pages when the origin answers 5xx / 530 or times out.
# Setup (once):  npx wrangler login && npx wrangler kv namespace create SNAPSHOTS
# then paste the printed id below and run:  npx wrangler deploy
name = "clinic-edge"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false

routes = [
  { pattern = "psicologojoaofernandes.com/*", zone_name = "psicologojoaofernandes.com" },
]

[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true

[[kv_namespaces]]
binding = "SNAPSHOTS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

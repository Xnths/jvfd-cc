# Copied to deploy/nginx/active/legacy-api.conf at cutover (see the plan's runbook):
# moves the old Next.js /api/* routes to the Go API. Same URLs, same contracts.
location ~ ^/api/(leads|subscribe|unsubscribe|comments)(/|$) {
    include /etc/nginx/snippets/proxy.conf;
    proxy_pass $api_upstream;
}

# Public entry point behind the Cloudflare tunnel (cloudflared -> clinic-nginx:80).
# Upstream names are resolved at request time through Docker's DNS, so recreating a Go
# container never leaves nginx pointing at a stale address.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name psicologojoaofernandes.com localhost;

    # cloudflared reaches us from the Docker network; trust its CF-Connecting-IP header only.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;

    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 12m;

    # Defines $frontend (the active blue/green Next.js container). Written by deploy.sh.
    include /etc/nginx/active/frontend.conf;

    set $auth_upstream http://clinic-auth:8081;
    set $api_upstream  http://clinic-api:8080;

    # Machine-only endpoints are never reachable from the internet.
    location = /auth/token         { return 404; }
    location ^~ /api/v1/internal/  { return 404; }

    location ^~ /auth/ {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass $auth_upstream;
    }
    location = /.well-known/jwks.json {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass $auth_upstream;
    }

    # Old Payload media URLs keep working after the cutover.
    location ^~ /api/media/file/ {
        rewrite ^/api/media/file/(.*)$ /media/$1 permanent;
    }
    location ^~ /media/ {
        alias /srv/media/;
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options nosniff;
        try_files $uri =404;
    }

    # New API surface: always served by Go.
    location ^~ /api/v1/ {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass $api_upstream;
    }

    # Legacy /api/* routes (leads, subscribe, ...). Empty until cutover, when deploy.sh writes
    # the rules that move them to Go.
    include /etc/nginx/active/legacy-api.conf;

    location / {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass $frontend;
    }
}

# Internal-only server (not published on the host): the Go API asks the active Next.js colour
# to revalidate its caches here, without having to know which colour is live.
server {
    listen 8081;
    resolver 127.0.0.11 valid=10s ipv6=off;
    include /etc/nginx/active/frontend.conf;

    location = /internal/revalidate {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass $frontend;
    }
    location / { return 404; }
}

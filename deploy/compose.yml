# Go platform stack. Next.js is not a service here: deploy.sh runs it as clinic-frontend-{blue,green}
# (blue/green), and joins it to both networks.
name: clinic

services:
  postgres:
    image: postgres:17-alpine
    container_name: clinic-postgres
    restart: always
    environment:
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: clinic
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?set AIRFLOW_DB_PASSWORD}
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic -d clinic"]
      interval: 10s
      timeout: 3s
      retries: 10
    mem_limit: 768m

  auth:
    build: ../backend
    image: clinic-backend:local
    container_name: clinic-auth
    restart: always
    entrypoint: ["/usr/local/bin/auth"]
    env_file: [../.env]
    environment:
      DATABASE_URL: postgres://clinic:${POSTGRES_PASSWORD}@postgres:5432/clinic?sslmode=disable
      AUTH_ADDR: ":8081"
      JWT_PRIVATE_KEY_FILE: /run/secrets/jwt.pem
      TRUST_PROXY: "true"
    volumes:
      - ../secrets/jwt.pem:/run/secrets/jwt.pem:ro
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]
    mem_limit: 128m

  api:
    build: ../backend
    image: clinic-backend:local
    container_name: clinic-api
    restart: always
    entrypoint: ["/usr/local/bin/api"]
    # Same uid as the Next.js image: the media volume's files belong to it (uploads write there).
    user: "1001:1001"
    env_file: [../.env]
    environment:
      DATABASE_URL: postgres://clinic:${POSTGRES_PASSWORD}@postgres:5432/clinic?sslmode=disable
      API_ADDR: ":8080"
      MEDIA_DIR: /srv/media
      TRUST_PROXY: "true"
      GSC_CREDENTIALS_FILE: /run/secrets/gsc/gsc-sa.json
    volumes:
      - media-data:/srv/media
      # Search Console service-account key (secrets/gsc/gsc-sa.json, 0600). The folder may be empty.
      - ../secrets/gsc:/run/secrets/gsc:ro
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]
    mem_limit: 192m

  nginx:
    image: nginx:stable-alpine
    container_name: clinic-nginx
    restart: always
    ports:
      - "82:80"
    volumes:
      - ./nginx/conf.d/clinic.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./nginx/active:/etc/nginx/active:ro
      - media-data:/srv/media:ro
    networks:
      - internal
      - cloudflare-net
    mem_limit: 64m

  # One-off tools: docker compose --profile tools run --rm migrate up
  migrate:
    profiles: [tools]
    build: ../backend
    image: clinic-backend:local
    entrypoint: ["/usr/local/bin/migrate"]
    environment:
      DATABASE_URL: postgres://clinic:${POSTGRES_PASSWORD}@postgres:5432/clinic?sslmode=disable
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]

  # ── Airflow (profile "airflow"): scheduled jobs only. Nothing user-facing depends on it. ──
  airflow-init:
    profiles: [airflow]
    build: ../airflow
    image: clinic-airflow:local
    container_name: clinic-airflow-init
    entrypoint: ["/entrypoint-clinic.sh"]
    command: ["db", "migrate"]
    environment: &airflow-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres:5432/airflow
      CLINIC_AIRFLOW_DB_URL: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
      AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:-}
      AIRFLOW__API__SECRET_KEY: ${AIRFLOW_JWT_SECRET:-}
      AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api:8080/execution/
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__PARALLELISM: "2"
      AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "1"
      AIRFLOW__CORE__AUTH_MANAGER: airflow.api_fastapi.auth.managers.simple.simple_auth_manager.SimpleAuthManager
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_passwords.json
      AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "600"
      AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "True"
      AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-}
      CLINIC_AUTH_URL: http://clinic-auth:8081
      CLINIC_API_URL: http://clinic-api:8080
      JOBS_CLIENT_ID: ${JOBS_CLIENT_ID:-}
      JOBS_CLIENT_SECRET: ${JOBS_CLIENT_SECRET:-}
      BACKUP_DB_PASSWORD: ${BACKUP_DB_PASSWORD:-}
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
      RCLONE_CONFIG_OFFSITE_TYPE: ${RCLONE_CONFIG_OFFSITE_TYPE:-}
      RCLONE_CONFIG_OFFSITE_PROVIDER: ${RCLONE_CONFIG_OFFSITE_PROVIDER:-}
      RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID: ${RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY: ${RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_OFFSITE_ENDPOINT: ${RCLONE_CONFIG_OFFSITE_ENDPOINT:-}
      GSC_SITE_URL: ${GSC_SITE_URL:-}
    volumes: &airflow-volumes
      - ../airflow/dags:/opt/airflow/dags:ro
      - ../airflow/tests:/opt/airflow/tests:ro
      - airflow-logs:/opt/airflow/logs
      - clinic-backups:/backups
      - media-data:/media:ro
    depends_on:
      postgres: { condition: service_healthy }
    networks: [internal]

  airflow-api:
    profiles: [airflow]
    image: clinic-airflow:local
    container_name: clinic-airflow-api
    restart: always
    command: ["api-server", "--port", "8080"]
    environment: *airflow-env
    volumes: *airflow-volumes
    # The UI is never exposed to the internet: reach it from the LAN or with `ssh -L 8088:localhost:8088`.
    ports: ["127.0.0.1:8088:8080"]
    depends_on:
      airflow-init: { condition: service_completed_successfully }
    networks: [internal]
    mem_limit: 700m

  airflow-scheduler:
    profiles: [airflow]
    image: clinic-airflow:local
    container_name: clinic-airflow-scheduler
    restart: always
    command: ["scheduler"]
    environment: *airflow-env
    volumes: *airflow-volumes
    depends_on:
      airflow-init: { condition: service_completed_successfully }
    networks: [internal]
    mem_limit: 800m

  airflow-dag-processor:
    profiles: [airflow]
    image: clinic-airflow:local
    container_name: clinic-airflow-dag-processor
    restart: always
    command: ["dag-processor"]
    environment: *airflow-env
    volumes: *airflow-volumes
    depends_on:
      airflow-init: { condition: service_completed_successfully }
    networks: [internal]
    mem_limit: 500m

networks:
  internal:
    name: clinic-internal
  cloudflare-net:
    external: true
    name: cloudflare-net

volumes:
  pg-data:
  airflow-logs:
  clinic-backups:
  # Same volume the current frontend writes uploads to (see deploy.sh: jvfd-cc_media-data).
  media-data:
    external: true
    name: jvfd-cc_media-data
